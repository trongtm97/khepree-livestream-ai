name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + multi-live tests
        run: npm test

      - name: Foundation contract check
        run: npm run test:foundation

      - name: Smoke mode gate (REAL must stay opt-in)
        run: npm run test:smoke:gate
